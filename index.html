<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="準備リスト">
<meta name="theme-color" content="#1d4ed8">
<title>工事準備リスト作成</title>
<style>
  :root{
    --blue:#1d4ed8; --blue-dark:#1e3a8a; --blue-light:#eff6ff;
    --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
    --gray-500:#64748b; --gray-700:#334155; --gray-900:#0f172a;
    --green:#16a34a; --red:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--gray-100); color:var(--gray-900);
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:#fff; padding:14px 16px 12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.02em;}
  header .sub{font-size:11.5px; opacity:.85; margin-top:2px;}
  .search-wrap{padding:10px 12px 4px; background:var(--gray-100); position:sticky; top:56px; z-index:19;}
  .search-box{
    display:flex; align-items:center; background:#fff; border-radius:12px;
    border:1px solid var(--gray-200); padding:9px 12px; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .search-box input{
    border:none; outline:none; flex:1; font-size:15px; background:transparent; color:var(--gray-900);
  }
  .search-box svg{width:16px;height:16px;color:var(--gray-500);margin-right:8px;flex-shrink:0;}
  .toolbar{
    display:flex; gap:8px; padding:8px 12px 2px; overflow-x:auto;
  }
  .chip-cat{
    flex-shrink:0; font-size:12.5px; padding:6px 12px; border-radius:999px;
    background:#fff; border:1px solid var(--gray-200); color:var(--gray-700); font-weight:600;
    white-space:nowrap;
  }
  .chip-cat.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  main{padding:6px 10px 0;}
  .category{
    background:#fff; border-radius:14px; margin:10px 0; overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid var(--gray-200);
  }
  .cat-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; cursor:pointer; user-select:none;
    background:var(--gray-50);
  }
  .cat-head .title{display:flex; align-items:center; gap:8px;}
  .cat-head .name{font-size:14.5px; font-weight:700; color:var(--gray-900);}
  .cat-head .count{
    font-size:11px; font-weight:700; color:var(--blue); background:var(--blue-light);
    border-radius:999px; padding:2px 8px; min-width:20px; text-align:center;
  }
  .cat-head .count.zero{display:none;}
  .chev{width:18px;height:18px;color:var(--gray-500); transition:transform .2s;}
  .category.collapsed .chev{transform:rotate(-90deg);}
  .cat-body{}
  .category.collapsed .cat-body{display:none;}

  .item-row{
    display:flex; align-items:center; gap:10px; padding:11px 14px;
    border-top:1px solid var(--gray-100); cursor:pointer;
  }
  .item-row.hidden{display:none;}
  .item-row.selected{background:var(--blue-light);}
  .item-row.expanded{background:var(--gray-50);}
  .box{
    width:23px;height:23px;border-radius:7px;border:2px solid var(--gray-300);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:#fff; transition:.12s; position:relative;
  }
  .item-row.selected .box{background:var(--blue); border-color:var(--blue);}
  .box svg{width:15px;height:15px;color:#fff; opacity:0; transform:scale(.5); transition:.12s;}
  .item-row.selected .box svg{opacity:1; transform:scale(1);}
  .item-text{flex:1; min-width:0;}
  .item-name{font-size:14.5px; font-weight:600; color:var(--gray-900); line-height:1.3;}
  .item-spec{font-size:11.5px; color:var(--gray-500); margin-top:1px; line-height:1.35;}
  .item-hint{font-size:10.5px; color:var(--blue); margin-top:1px; font-weight:600;}

  .qty-wrap{
    display:flex; align-items:center; gap:0; flex-shrink:0;
    background:var(--gray-100); border-radius:9px; overflow:hidden;
  }
  .qty-btn{
    width:28px;height:28px; border:none; background:transparent; font-size:16px; font-weight:700;
    color:var(--blue); display:flex; align-items:center; justify-content:center;
  }
  .qty-btn:active{background:var(--gray-200);}
  .qty-val{
    width:28px; text-align:center; font-size:13.5px; font-weight:700; color:var(--gray-900);
    border:none; background:transparent; -moz-appearance:textfield;
  }
  .qty-val::-webkit-outer-spin-button,.qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .badge-count{
    font-size:11px; font-weight:800; color:#fff; background:var(--blue);
    border-radius:999px; padding:2px 8px; flex-shrink:0;
  }
  .chev-mini{width:16px;height:16px;color:var(--gray-400); flex-shrink:0; transition:transform .2s;}
  .item-row.expanded .chev-mini{transform:rotate(180deg);}

  .opt-panel{
    display:none; padding:2px 14px 14px 47px; border-top:1px dashed var(--gray-200); background:var(--gray-50);
  }
  .opt-panel.show{display:block;}
  .opt-hint{font-size:10.5px; color:var(--gray-500); margin:8px 0 6px;}
  .opt-list{display:flex; flex-direction:column; gap:6px;}
  .opt-item{
    display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--gray-200);
    border-radius:10px; padding:8px 10px;
  }
  .opt-item.on{border-color:var(--blue); background:var(--blue-light);}
  .opt-chip-box{
    width:19px;height:19px;border-radius:6px;border:2px solid var(--gray-300); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .opt-item.on .opt-chip-box{background:var(--blue); border-color:var(--blue);}
  .opt-chip-box svg{width:12px;height:12px;color:#fff; opacity:0;}
  .opt-item.on .opt-chip-box svg{opacity:1;}
  .opt-label{flex:1; font-size:13px; font-weight:600; color:var(--gray-900); min-width:0;}
  .opt-custom-input{
    flex:1; min-width:0; border:1px solid var(--gray-200); border-radius:8px; padding:6px 8px;
    font-size:12.5px; background:var(--gray-50); display:none;
  }
  .opt-item.on .opt-custom-input.enabled{display:block;}
  .opt-qty{display:none; flex-shrink:0;}
  .opt-item.on .opt-qty{display:flex;}

  .empty-msg{padding:24px; text-align:center; color:var(--gray-500); font-size:13px;}

  .footer-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:#fff; border-top:1px solid var(--gray-200);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
    display:flex; gap:10px; align-items:center;
  }
  .footer-bar .selcount{font-size:12.5px; color:var(--gray-700); flex-shrink:0;}
  .footer-bar .selcount b{color:var(--blue); font-size:15px;}
  .btn-primary{
    flex:1; background:var(--blue); color:#fff; border:none; border-radius:12px;
    padding:13px; font-size:15px; font-weight:700; box-shadow:0 2px 6px rgba(29,78,216,.35);
  }
  .btn-primary:disabled{background:var(--gray-300); box-shadow:none;}
  .btn-clear{
    flex-shrink:0; background:none; border:1px solid var(--gray-300); color:var(--gray-500);
    border-radius:12px; padding:12px 12px; font-size:12px; font-weight:600;
  }

  /* summary screen */
  #summary{
    position:fixed; inset:0; background:var(--gray-100); z-index:50;
    display:none; flex-direction:column;
  }
  #summary.show{display:flex;}
  .sum-head{
    background:linear-gradient(135deg,var(--blue),var(--blue-dark)); color:#fff;
    padding:14px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .sum-head button{
    background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:9px;
    width:34px;height:34px; font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .sum-head h2{margin:0; font-size:15.5px; font-weight:700; flex:1;}
  .sum-scroll{flex:1; overflow-y:auto; padding:14px;}
  .sum-card{
    background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06);
    border:1px solid var(--gray-200); max-width:640px; margin:0 auto;
  }
  .meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .meta-field{display:flex; flex-direction:column; gap:3px;}
  .meta-field.full{grid-column:1/-1;}
  .meta-field label{font-size:10.5px; color:var(--gray-500); font-weight:700;}
  .meta-field input{
    border:1px solid var(--gray-200); border-radius:8px; padding:7px 9px; font-size:13.5px;
    background:var(--gray-50); color:var(--gray-900);
  }
  .sum-title{font-size:16px; font-weight:800; text-align:center; margin:2px 0 12px; color:var(--gray-900);}
  .sum-cat{margin-bottom:14px;}
  .sum-cat h3{
    font-size:12.5px; font-weight:800; color:var(--blue); border-bottom:2px solid var(--blue-light);
    padding-bottom:5px; margin:0 0 6px;
  }
  table.sum-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.sum-table td{padding:6px 4px; border-bottom:1px solid var(--gray-100); vertical-align:top;}
  table.sum-table td.chk{width:20px; color:var(--green); font-weight:800; font-size:13px;}
  table.sum-table td.qty{width:46px; text-align:right; font-weight:700; white-space:nowrap;}
  table.sum-table .nm{font-weight:700; color:var(--gray-900);}
  table.sum-table .sp{color:var(--gray-500); font-size:11px; margin-top:1px;}
  .sum-actions{
    flex-shrink:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:#fff;
    border-top:1px solid var(--gray-200); display:flex; gap:8px;
  }
  .btn-outline{
    flex:1; background:#fff; border:1.5px solid var(--blue); color:var(--blue); border-radius:12px;
    padding:12px; font-size:13.5px; font-weight:700;
  }
  .btn-outline.copied{background:var(--green); border-color:var(--green); color:#fff;}
  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    background:var(--gray-900); color:#fff; padding:9px 16px; border-radius:999px; font-size:12.5px;
    z-index:60; opacity:0; pointer-events:none; transition:.2s;
  }
  .toast.show{opacity:1;}

  @media print{
    body *{visibility:hidden;}
    #summary, #summary *{visibility:visible;}
    #summary{position:absolute; inset:auto; top:0; left:0; display:block !important; background:#fff;}
    .sum-head, .sum-actions{display:none !important;}
    .sum-scroll{overflow:visible; padding:0;}
    .sum-card{box-shadow:none; border:none; max-width:100%;}
  }
</style>
</head>
<body>

<header>
  <h1>🛠 工事準備リスト作成</h1>
  <div class="sub">品名を選択 → 仕様を選択 → 数量を入力</div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="道具名で検索..." autocomplete="off">
  </div>
  <div class="toolbar" id="catChips"></div>
</div>

<main id="mainList"></main>

<div class="footer-bar">
  <div class="selcount"><b id="selCountNum">0</b>点選択中</div>
  <button class="btn-clear" id="clearBtn">全解除</button>
  <button class="btn-primary" id="makeListBtn" disabled>準備リストを作成</button>
</div>

<div id="summary">
  <div class="sum-head">
    <button id="backBtn">←</button>
    <h2>準備リスト</h2>
  </div>
  <div class="sum-scroll">
    <div class="sum-card">
      <div class="meta-grid">
        <div class="meta-field"><label>工事名</label><input type="text" id="projName" placeholder="○○工事"></div>
        <div class="meta-field"><label>日付</label><input type="date" id="projDate"></div>
        <div class="meta-field full"><label>準備者</label><input type="text" id="projPerson" placeholder="氏名"></div>
      </div>
      <div class="sum-title" id="sumTitle">工事準備リスト</div>
      <div id="sumBody"></div>
    </div>
  </div>
  <div class="sum-actions">
    <button class="btn-outline" id="copyBtn">📋 テキストをコピー</button>
    <button class="btn-outline" id="printBtn">🖨 印刷 / PDF保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
const CHEV_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>';

// state[itemKey] = { hasOptions, expanded, checked, qty, opts:[{checked,qty,customText}] }
const state = {};
DATA.forEach((cat,ci)=>cat.items.forEach((it,ii)=>{
  const key = ci+'-'+ii;
  const hasOptions = it.options && it.options.length>0;
  state[key] = {
    hasOptions,
    expanded:false,
    checked:false,
    qty:1,
    opts: hasOptions ? it.options.map(()=>({checked:false, qty:1, customText:''})) : []
  };
}));

const mainList = document.getElementById('mainList');
const catChips = document.getElementById('catChips');

function render(){
  mainList.innerHTML = '';
  catChips.innerHTML = '<span class="chip-cat active" data-cat="all">すべて</span>';
  DATA.forEach((cat,ci)=>{
    const chip = document.createElement('span');
    chip.className='chip-cat'; chip.dataset.cat=ci; chip.textContent=cat.category;
    catChips.appendChild(chip);

    const card = document.createElement('div');
    card.className='category'; card.dataset.cat=ci;
    const head = document.createElement('div');
    head.className='cat-head';
    head.innerHTML = `<div class="title"><span class="name">${cat.category}</span><span class="count zero" id="cnt-${ci}">0</span></div>${CHEV_SVG.replace('svg viewBox','svg class="chev" viewBox')}`;
    head.addEventListener('click', ()=> card.classList.toggle('collapsed'));
    card.appendChild(head);

    const body = document.createElement('div');
    body.className='cat-body';
    cat.items.forEach((it,ii)=>{
      const key = ci+'-'+ii;
      const s = state[key];
      const row = document.createElement('div');
      row.className='item-row'; row.dataset.key=key; row.dataset.name=it.name.toLowerCase();

      if(s.hasOptions){
        row.innerHTML = `
          <div class="box">${CHECK_SVG}</div>
          <div class="item-text">
            <div class="item-name">${it.name}</div>
            <div class="item-hint" id="hint-${key}">仕様を選んでください</div>
          </div>
          <span class="badge-count" id="badge-${key}" style="display:none;">0</span>
          ${CHEV_SVG.replace('svg viewBox','svg class="chev-mini" viewBox')}
        `;
        row.addEventListener('click', ()=> toggleExpand(key));
        body.appendChild(row);

        const panel = document.createElement('div');
        panel.className='opt-panel'; panel.id='panel-'+key;
        const list = document.createElement('div'); list.className='opt-list';
        it.options.forEach((opt,oi)=>{
          const optRow = document.createElement('div');
          optRow.className='opt-item'; optRow.dataset.key=key; optRow.dataset.oi=oi;
          optRow.innerHTML = `
            <div class="opt-chip-box">${CHECK_SVG}</div>
            <div class="opt-label">${opt.label}</div>
            ${opt.custom ? `<input type="text" class="opt-custom-input enabled" placeholder="内容を入力" />` : ''}
            <div class="qty-wrap opt-qty">
              <button class="qty-btn" data-act="minus">−</button>
              <input class="qty-val" type="number" min="1" value="1" inputmode="numeric">
              <button class="qty-btn" data-act="plus">＋</button>
            </div>`;
          optRow.addEventListener('click',(e)=>{
            if(e.target.closest('.opt-qty') || e.target.closest('.opt-custom-input')) return;
            toggleOption(key, oi);
          });
          const qi = optRow.querySelector('.qty-val');
          optRow.querySelector('[data-act="minus"]').addEventListener('click',(e)=>{e.stopPropagation(); changeOptQty(key,oi,-1);});
          optRow.querySelector('[data-act="plus"]').addEventListener('click',(e)=>{e.stopPropagation(); changeOptQty(key,oi,1);});
          qi.addEventListener('click', e=>e.stopPropagation());
          qi.addEventListener('change', ()=>{
            let v = parseInt(qi.value)||1; if(v<1) v=1;
            state[key].opts[oi].qty = v; qi.value = v;
          });
          const ci2 = optRow.querySelector('.opt-custom-input');
          if(ci2){
            ci2.addEventListener('click', e=>e.stopPropagation());
            ci2.addEventListener('input', ()=>{ state[key].opts[oi].customText = ci2.value; });
          }
          list.appendChild(optRow);
        });
        panel.appendChild(list);
        body.appendChild(panel);
      } else {
        row.innerHTML = `
          <div class="box">${CHECK_SVG}</div>
          <div class="item-text"><div class="item-name">${it.name}</div>${it.spec?`<div class="item-spec">${it.spec}</div>`:''}</div>
          <div class="qty-wrap" style="opacity:0;pointer-events:none;">
            <button class="qty-btn" data-act="minus">−</button>
            <input class="qty-val" type="number" min="1" value="1" inputmode="numeric">
            <button class="qty-btn" data-act="plus">＋</button>
          </div>`;
        row.addEventListener('click',(e)=>{
          if(e.target.closest('.qty-wrap')) return;
          toggleSimple(key);
        });
        const qtyWrap = row.querySelector('.qty-wrap');
        row.querySelector('[data-act="minus"]').addEventListener('click',(e)=>{e.stopPropagation(); changeSimpleQty(key,-1);});
        row.querySelector('[data-act="plus"]').addEventListener('click',(e)=>{e.stopPropagation(); changeSimpleQty(key,1);});
        const qtyInput = row.querySelector('.qty-val');
        qtyInput.addEventListener('click', e=>e.stopPropagation());
        qtyInput.addEventListener('change', ()=>{
          let v = parseInt(qtyInput.value)||1; if(v<1) v=1;
          state[key].qty = v; qtyInput.value = v;
        });
        body.appendChild(row);
      }
    });
    card.appendChild(body);
    mainList.appendChild(card);
  });
}

function toggleExpand(key){
  const s = state[key];
  s.expanded = !s.expanded;
  document.querySelector(`.item-row[data-key="${key}"]`).classList.toggle('expanded', s.expanded);
  document.getElementById('panel-'+key).classList.toggle('show', s.expanded);
}

function toggleOption(key, oi){
  const s = state[key];
  const o = s.opts[oi];
  o.checked = !o.checked;
  const optRow = document.querySelector(`.opt-item[data-key="${key}"][data-oi="${oi}"]`);
  optRow.classList.toggle('on', o.checked);
  refreshItemBadge(key);
  updateCounts();
}
function changeOptQty(key, oi, d){
  const s = state[key];
  if(!s.opts[oi].checked) return;
  s.opts[oi].qty = Math.max(1, s.opts[oi].qty + d);
  document.querySelector(`.opt-item[data-key="${key}"][data-oi="${oi}"] .qty-val`).value = s.opts[oi].qty;
}
function refreshItemBadge(key){
  const s = state[key];
  const n = s.opts.filter(o=>o.checked).length;
  const badge = document.getElementById('badge-'+key);
  const row = document.querySelector(`.item-row[data-key="${key}"]`);
  const hint = document.getElementById('hint-'+key);
  if(n>0){
    badge.style.display=''; badge.textContent = n+'件';
    row.classList.add('selected');
    hint.textContent = '選択済み';
  } else {
    badge.style.display='none';
    row.classList.remove('selected');
    hint.textContent = '仕様を選んでください';
  }
}

function toggleSimple(key){
  const s = state[key];
  s.checked = !s.checked;
  const row = document.querySelector(`.item-row[data-key="${key}"]`);
  row.classList.toggle('selected', s.checked);
  const qw = row.querySelector('.qty-wrap');
  qw.style.opacity = s.checked ? '1':'0';
  qw.style.pointerEvents = s.checked ? 'auto':'none';
  if(s.checked) row.querySelector('.qty-val').value = s.qty;
  updateCounts();
}
function changeSimpleQty(key,d){
  const s = state[key];
  if(!s.checked) return;
  s.qty = Math.max(1, s.qty + d);
  document.querySelector(`.item-row[data-key="${key}"] .qty-val`).value = s.qty;
}

function updateCounts(){
  let total = 0;
  DATA.forEach((cat,ci)=>{
    let c = 0;
    cat.items.forEach((it,ii)=>{
      const key = ci+'-'+ii;
      const s = state[key];
      if(s.hasOptions){ c += s.opts.filter(o=>o.checked).length; }
      else if(s.checked){ c += 1; }
    });
    total += c;
    const el = document.getElementById('cnt-'+ci);
    el.textContent = c; el.classList.toggle('zero', c===0);
  });
  document.getElementById('selCountNum').textContent = total;
  document.getElementById('makeListBtn').disabled = total===0;
}

// search & category filter
let activeCat = 'all';
document.getElementById('searchInput').addEventListener('input', applyFilter);
catChips.addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip-cat'); if(!chip) return;
  [...catChips.children].forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeCat = chip.dataset.cat;
  applyFilter();
});
function applyFilter(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('.category').forEach(card=>{
    const ci = card.dataset.cat;
    const catMatch = activeCat==='all' || activeCat===ci;
    let anyVisible = false;
    card.querySelectorAll('.item-row').forEach(row=>{
      const nameMatch = !q || row.dataset.name.includes(q) || row.textContent.toLowerCase().includes(q);
      const show = catMatch && nameMatch;
      row.classList.toggle('hidden', !show);
      const key = row.dataset.key;
      const panel = document.getElementById('panel-'+key);
      if(panel) panel.classList.toggle('hidden', !show);
      if(show) anyVisible = true;
    });
    card.style.display = anyVisible ? '' : 'none';
    if(q && anyVisible) card.classList.remove('collapsed');
  });
}

document.getElementById('clearBtn').addEventListener('click', ()=>{
  Object.keys(state).forEach(k=>{
    const s = state[k];
    s.checked=false; s.qty=1; s.expanded=false;
    s.opts.forEach(o=>{ o.checked=false; o.qty=1; o.customText=''; });
  });
  render();
  updateCounts();
});

const summaryEl = document.getElementById('summary');
document.getElementById('makeListBtn').addEventListener('click', buildSummary);
document.getElementById('backBtn').addEventListener('click', ()=> summaryEl.classList.remove('show'));

function buildSummary(){
  const dInput = document.getElementById('projDate');
  if(!dInput.value){
    dInput.value = new Date().toISOString().slice(0,10);
  }
  const body = document.getElementById('sumBody');
  body.innerHTML = '';
  DATA.forEach((cat,ci)=>{
    const lines = [];
    cat.items.forEach((it,ii)=>{
      const key = ci+'-'+ii;
      const s = state[key];
      if(s.hasOptions){
        s.opts.forEach((o,oi)=>{
          if(!o.checked) return;
          const opt = it.options[oi];
          const label = opt.custom ? (o.customText.trim() ? o.customText.trim() : '自由入力') : opt.label;
          lines.push({name:it.name, spec:label, qty:o.qty});
        });
      } else if(s.checked){
        lines.push({name:it.name, spec:it.spec, qty:s.qty});
      }
    });
    if(lines.length===0) return;
    const wrap = document.createElement('div');
    wrap.className='sum-cat';
    const h3 = document.createElement('h3'); h3.textContent = cat.category;
    wrap.appendChild(h3);
    const table = document.createElement('table'); table.className='sum-table';
    lines.forEach(r=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="chk">✔</td>
        <td><div class="nm">${r.name}</div>${r.spec?`<div class="sp">${r.spec}</div>`:''}</td>
        <td class="qty">${r.qty} 点</td>`;
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    body.appendChild(wrap);
  });
  summaryEl.classList.add('show');
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const proj = document.getElementById('projName').value || '（工事名未入力）';
  const date = document.getElementById('projDate').value || '';
  const person = document.getElementById('projPerson').value || '';
  let out = [`【工事準備リスト】`, `工事名: ${proj}`, `日付: ${date}`, `準備者: ${person}`, ''];
  DATA.forEach((cat,ci)=>{
    const lines = [];
    cat.items.forEach((it,ii)=>{
      const key = ci+'-'+ii;
      const s = state[key];
      if(s.hasOptions){
        s.opts.forEach((o,oi)=>{
          if(!o.checked) return;
          const opt = it.options[oi];
          const label = opt.custom ? (o.customText.trim() ? o.customText.trim() : '自由入力') : opt.label;
          lines.push(`□ ${it.name}（${label}） ×${o.qty}`);
        });
      } else if(s.checked){
        const spec = it.spec ? `（${it.spec}）` : '';
        lines.push(`□ ${it.name}${spec} ×${s.qty}`);
      }
    });
    if(lines.length===0) return;
    out.push(`■ ${cat.category}`);
    out.push(...lines);
    out.push('');
  });
  const text = out.join('\n');
  const finish = ()=>{
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied'); btn.textContent = '✔ コピーしました';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent='📋 テキストをコピー'; }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(()=>fallbackCopy(text,finish));
  } else {
    fallbackCopy(text,finish);
  }
});
function fallbackCopy(text,cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

render();
updateCounts();
</script>
</body>
